name: GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Build
        env:
          VITE_AUTH_ENABLED: "false"
        run: npm run build
      - name: Static marker
        run: touch .vercel/output/static/.nojekyll
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vercel/output/static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
